server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The shell is a role-aware application; a cached index.html could hand a
    # reviewer an admin bundle (or a stale pre-reveal view). Never cache it.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        # Vite emits content-hashed asset names: these are safe to cache.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The API sets Cache-Control: no-store itself; pass every header through.
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
