services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
      POSTGRES_DB: review
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://review:review@db:5432/review
      JWT_SECRET: change-me-in-production-please
      ADMIN_PASSWORD: admin123
      REVIEWER_PASSWORD: reviewer123
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  verify:
    build:
      context: ./backend
      dockerfile: Dockerfile.verify
    environment:
      DATABASE_URL: postgresql+psycopg://review:review@db:5432/review
      JWT_SECRET: change-me-in-production-please
      ADMIN_PASSWORD: admin123
      REVIEWER_PASSWORD: reviewer123
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../tests:/verify
    command: ["python", "-m", "pytest", "-v", "/verify"]

volumes:
  pgdata:
